
name: Vue Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 拉取代码
      - name: 拉取代码
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 3. 安装依赖
      - name: 安装依赖
        run: npm ci

      # 4. 构建 Vue 项目
      - name: 构建项目
        run: npm run build

      # 5. 检查构建产物
      - name: 检查 dist 目录
        run: |
          test -d dist
          test -f dist/index.html
          echo "构建成功，dist/index.html 已生成"
          find dist -maxdepth 2 -type f | head -50

      # 6. 保存构建产物，方便下载
      - name: 保存构建产物
        uses: actions/upload-artifact@v4
        with:
          name: vue-dist
          path: dist/
          retention-days: 30

      # 7. 配置服务器身份验证
      - name: 配置 SSH 主机验证
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -e
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts

      # 8. 加载私钥
      - name: 加载 SSH 私钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # 9. 检查 SSH 登录及目录权限
      - name: 检查服务器连接
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH' && echo 'SSH 登录成功，网站目录可写'"

      # 10. 安装 rsync
      - name: 安装 rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync

      # 11. 上传文件到网站目录
      - name: 部署到服务器
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -e

          rsync -rz --itemize-changes --delete \
            --exclude='.well-known/' \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

          echo "部署完成"

